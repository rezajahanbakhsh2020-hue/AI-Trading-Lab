name: Production Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run production pipeline
        run: |
          PYTHONPATH=. python run_production.py

      - name: Show production results
        run: |
          find results -type f -print 2>/dev/null || true

      - name: Upload production results
        uses: actions/upload-artifact@v4
        with:
          name: production-results
          path: results/production/
          if-no-files-found: warn

      - name: Upload walk-forward results
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-results
          path: results/walk_forward/
          if-no-files-found: warn
