name: Tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests
        run: |
          if [ -d tests ] && find tests -type f -name "*.py" | grep -q .; then
            PYTHONPATH=. pytest
          else
            echo "No tests found - skipping pytest"
          fi

      - name: Run real backtest
        run: |
          PYTHONPATH=. python run_backtest.py

      - name: Run production pipeline
        run: |
          PYTHONPATH=. python run_production.py

      - name: Enforce production readiness chain against committed research store
        run: |
          PYTHONPATH=. python run_production_end_to_end.py

      - name: Upload canonical research artifacts for promotion review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-canonical-research-artifacts
          path: results/research_experiments/**
          if-no-files-found: ignore
          retention-days: 7
