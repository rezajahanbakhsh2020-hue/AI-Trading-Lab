name: Live Proof

on:
  workflow_dispatch:

jobs:
  live-proof:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run live proof tests
        run: |
          PYTHONPATH=. pytest tests/test_run_live_proof.py -q

      - name: Run real XAU/USD live proof
        run: |
          PYTHONPATH=. python run_live_proof.py

      - name: Show saved live snapshot
        run: |
          echo "=== Saved Live Snapshot ==="
          cat results/live/live_snapshot.json
