name: OpenCode End-to-End Trading Pipeline Repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  repair:
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'github-actions[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/opencode') &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve pull request head
        id: resolve-pr
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.payload.issue?.number;
            if (!number) {
              core.setFailed("No pull request number is available in this event.");
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed("Refusing to run OpenCode on a fork-owned branch.");
              return;
            }
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-pr.outputs.head_ref }}
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Investigate and repair the canonical XAUUSD pipeline
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/glm-5.3-flash-free
          agent: build
          use_github_token: true
          prompt: |
            OWNER DIRECTIVE — COMPLETE THE SIMPLIFICATION AND MERGE WHEN PROVEN

            The repository owner explicitly authorizes you to implement the simplified live-signal architecture, commit it to the existing PR #99 branch, and merge PR #99 yourself once the implementation and verification gates below pass. This supersedes every earlier instruction in this workflow that prohibited merging or required manual merge. Do not stop at an audit, plan, test-only commit, or report.

            PRIMARY GOAL
            Make each canonical XAUUSD timeframe independently produce and publish its own truthful live decision through P1's existing P2 publisher:
            market data for that timeframe -> deterministic strategy -> BUY / SELL / NO TRADE -> P1 publication contract.
            Canonical timeframes: 1m, 5m, 15m, 30m, 1H, 4H, 1D.
            Live signal generation must not require candidate_id, persisted promotion, governance fingerprints, research qualification, or candidate authorization. Keep offline research/governance modules intact where they remain useful; simplify only the live execution path.

            IMPLEMENT, DON'T JUST DESCRIBE
            1. Inspect current PR #99 branch, recent commits, issue #100, runtime, publisher contract, and existing tests. Reuse verified findings.
            2. Implement one transparent deterministic strategy with explicit parameters, evaluated independently on each timeframe's own data. A closed, fresh candle is mandatory. Never borrow data, candidate, signal, readiness, or health from another timeframe.
            3. Emit BUY/SELL only when the actual rule is met. Otherwise emit NO TRADE with a machine-readable reason. Insufficient/stale/invalid data must fail closed. Never invent prices, timestamps, confidence, stability, or market data.
            4. Calculate entry, stop-loss, take-profit and risk/reward only from real candle values and explicit risk rules. NO TRADE has null trade levels.
            5. Publish through the existing P1→P2 contract. If the contract cannot represent the direct strategy safely, extend the contract and focused tests; do not falsely label a direct rule-based signal as promoted/authorized. Preserve real event time versus publication time.
            6. Isolate per-timeframe failures so one bad frame does not stop the other six. Report per-frame readiness honestly; never call the worker ready when required frames are blocked.
            7. Remove candidate-specific live-runtime configuration/dead branches only when tests prove the new path is complete. Do not delete offline research/governance.
            8. Keep publication disabled in tests; do not place broker orders or send production events. Never weaken freshness, closed-candle, data-integrity, risk, or provenance checks to make tests pass.
            9. Add focused tests for seven-frame independence, direct decisions without candidates, BUY/SELL/NO TRADE, stale/future/invalid and unclosed candles, risk fields, publication contract, and per-frame error isolation. Run focused tests, then the broadest practical suite and relevant end-to-end entrypoint. Report exact commands and actual results.
            10. Inspect the full diff and status. Commit functional source changes and tests to the existing PR #99 branch only. Do not create a new PR or branch. Update PR #99 with evidence and a per-timeframe status table.

            REPOSITORY / SCOPE
            Repository: rezajahanbakhsh2020-hue/AI-Trading-Lab.
            Existing PR #99: Repair Canonical XAUUSD Pipeline End-to-End.
            Existing branch expected: rezajahanbakhsh2020-hue-patch-1. Verify PR head/base/SHA before writing. Work on the PR's actual head branch only.
            Issue #100 is the specification for simplification.
            P2 is a separate gateway/presentation layer; do not modify AI-Trading-Lab-Platform. Use P1's existing documented publication contract and existing P1 evidence only.
            Do not change secrets, repository settings, deployment configuration, or production systems. No broker orders. No fabricated evidence. Never claim deployment delivery without direct proof.

            MERGE AUTHORIZATION AND EXIT GATE
            The owner explicitly authorizes you to merge PR #99 after all of the following are true:
            - Actual functional implementation is committed; a test-only change is not sufficient.
            - Focused regression tests pass, and the broad suite has been run to the extent practical. Any failure is understood and fixed or demonstrably unrelated with a precise explanation.
            - The complete diff is in scope and contains no weakened/deleted safety gates or fabricated evidence.
            - PR checks required by the repository are green and GitHub reports the PR mergeable. Verify the current head SHA before merging.
            - The PR summary states what changed, tests actually run, what remains blocked per timeframe, and what is not proven in deployment.
            If these gates pass, merge PR #99 using the repository's allowed merge method and verify GitHub reports merged=true with a merge commit SHA. Do not stop merely to ask for permission again. If a required check or branch rule blocks merge, do not bypass branch protection; continue fixing actionable issues and report the exact remaining blocker.
            Do not merge unrelated PRs. Do not claim success without reading the actual GitHub result.

            REQUIRED FINAL REPORT
            A. Starting and ending PR head SHAs and commit SHAs created.
            B. Source files changed and concrete runtime behavior changed.
            C. Exact test commands, exit codes, and observed outcomes.
            D. Seven-frame readiness table (READY/BLOCKED with evidence-based reason).
            E. P1→P2 publication status: locally proven versus deployment-unverified.
            F. Merge result: merged flag, merge commit SHA, or exact blocker.
            Continue iteratively until all safely actionable implementation work is complete.