name: OpenCode End-to-End Trading Pipeline Repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  repair:
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'github-actions[bot]') ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '/opencode') &&
       github.actor == github.repository_owner &&
       (github.event.issue.number == 100 || github.event.issue.pull_request))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve target branch
        id: resolve-pr
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const eventPr = context.payload.pull_request;
            if (eventPr) {
              if (eventPr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.setFailed("Refusing to run OpenCode on a fork-owned branch.");
                return;
              }
              core.setOutput("head_ref", eventPr.head.ref);
              core.setOutput("target_kind", "pr");
              core.setOutput("target_number", String(eventPr.number));
              return;
            }
            if (issue?.number === 100 && !issue.pull_request) {
              core.setOutput("head_ref", "main");
              core.setOutput("target_kind", "issue");
              core.setOutput("target_number", "100");
              return;
            }
            if (issue?.pull_request) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issue.number,
              });
              if (pr.merged || pr.state !== "open") {
                core.setFailed("This PR is already closed. Trigger OpenCode from Issue #100 to create the simplification PR.");
                return;
              }
              if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.setFailed("Refusing to run OpenCode on a fork-owned branch.");
                return;
              }
              core.setOutput("head_ref", pr.head.ref);
              core.setOutput("target_kind", "pr");
              core.setOutput("target_number", String(pr.number));
              return;
            }
            core.setFailed("Use /opencode on Issue #100 or an open same-repository PR.");

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-pr.outputs.head_ref }}
          persist-credentials: true

      - name: Create implementation branch for Issue #100
        if: steps.resolve-pr.outputs.target_kind == 'issue'
        run: |
          git switch -c "opencode/simplify-live-signals-${GITHUB_RUN_ID}"

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Investigate and repair the canonical XAUUSD pipeline
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/glm-5.3-flash-free
          agent: build
          use_github_token: true
          prompt: |
            OWNER DIRECTIVE — IMPLEMENT THE FOLLOW-UP FIX; NEVER MERGE AUTOMATICALLY

            The repository owner authorizes implementation, tests, commits, and one coherent PR, but explicitly requires MANUAL MERGE ONLY. Never merge any PR, never bypass branch protection, and do not stop at an audit, plan, test-only commit, or report.

            PRIMARY GOAL
            Make each canonical XAUUSD timeframe independently produce and publish its own truthful live decision through P1's existing P2 publisher:
            market data for that timeframe -> deterministic strategy -> BUY / SELL / NO TRADE -> P1 publication contract.
            Canonical timeframes: 1m, 5m, 15m, 30m, 1H, 4H, 1D.
            Live signal generation must not require candidate_id, persisted promotion, governance fingerprints, research qualification, or candidate authorization. Keep offline research/governance modules intact where they remain useful; simplify only the live execution path.

            IMPLEMENT, DON'T JUST DESCRIBE
            1. Inspect current main, recent commits, issue #100, runtime, publisher contract, and existing tests. Reuse verified findings.
            2. Replace crossover-only live logic with a compact deterministic multi-setup strategy: retain MA crossover, add trend-continuation-after-pullback and confirmed breakout/momentum setups with explicit parameters and invalidation. BUY and SELL must be symmetric where supported. Evaluate independently on each timeframe's own closed, fresh candles. Never borrow data, candidate, signal, readiness, or health from another timeframe. Do not merely convert NO TRADE into a direction and do not use trend direction alone as an entry.
            3. Emit BUY/SELL only when the actual rule is met. Otherwise emit NO TRADE with a machine-readable reason. Insufficient/stale/invalid data must fail closed. Never invent prices, timestamps, confidence, stability, or market data.
            4. Calculate entry, stop-loss, take-profit and risk/reward only from real candle values and explicit risk rules. NO TRADE has null trade levels.
            5. Publish through the existing P1→P2 contract. If the contract cannot represent the direct strategy safely, extend the contract and focused tests; do not falsely label a direct rule-based signal as promoted/authorized. Preserve real event time versus publication time.
            6. Isolate per-timeframe failures so one bad frame does not stop the other six. Report per-frame readiness honestly; never call the worker ready when required frames are blocked.
            7. Remove candidate-specific live-runtime configuration/dead branches only when tests prove the new path is complete. Do not delete offline research/governance.
            8. Keep publication disabled in tests; do not place broker orders or send production events. Never weaken freshness, closed-candle, data-integrity, risk, or provenance checks to make tests pass.
            9. Add focused tests for seven-frame independence, direct decisions without candidates, every entry setup for BUY/SELL/NO TRADE, stale/future/invalid and unclosed candles, risk fields, publication contract, and per-frame error isolation. Evaluate current crossover versus new setups on the committed genuine 1m/5m historical CSVs using chronological out-of-sample or walk-forward splits, no leakage, non-zero transaction costs and slippage. First verify short-trade, execution-timing, stop/TP and cost semantics in the existing backtest engine; do not report fabricated metrics. Report BUY/SELL counts, NO TRADE ratio, win rate, expectancy, net return after costs, max drawdown, trade duration, date ranges and sample sizes. Run focused tests, then the broadest practical suite and relevant end-to-end entrypoint. Report exact commands and actual results.
            10. Inspect the full diff and status. Commit functional source changes and tests to the existing the simplification PR branch only. For an Issue #100 run, create a new implementation branch and open one PR; for an existing open PR run, stay on its branch. Update the simplification PR with evidence and a per-timeframe status table.

            REPOSITORY / SCOPE
            Repository: rezajahanbakhsh2020-hue/AI-Trading-Lab.
            Existing the simplification PR: Repair Canonical XAUUSD Pipeline End-to-End.
            Existing branch expected: rezajahanbakhsh2020-hue-patch-1. Verify PR head/base/SHA before writing. Work on the PR's actual head branch only.
            Issue #100 is the specification for simplification.
            P2 is a separate gateway/presentation layer; do not modify AI-Trading-Lab-Platform. Use P1's existing documented publication contract and existing P1 evidence only.
            Do not change secrets, repository settings, deployment configuration, or production systems. No broker orders. No fabricated evidence. Never claim deployment delivery without direct proof.

            MERGE AUTHORIZATION AND EXIT GATE
            The owner requires MANUAL MERGE ONLY. Do not merge the simplification PR or any other PR. After all of the following verification gates are satisfied:
            - Actual functional implementation is committed; a test-only change is not sufficient.
            - Focused regression tests pass, and the broad suite has been run to the extent practical. Any failure is understood and fixed or demonstrably unrelated with a precise explanation.
            - The complete diff is in scope and contains no weakened/deleted safety gates or fabricated evidence.
            - PR checks required by the repository are green and GitHub reports the PR mergeable. Verify the current head SHA before merging.
            - The PR summary states what changed, tests actually run, what remains blocked per timeframe, and what is not proven in deployment.
            If these gates pass, leave the PR open for the owner to review and merge manually. Do not stop merely after tests: finish implementation and provide the evidence report. If a required check or branch rule blocks progress, do not bypass branch protection; continue fixing actionable issues and report the exact remaining blocker.
            Do not merge unrelated PRs. Do not claim success without reading the actual GitHub result.

            REQUIRED FINAL REPORT
            A. Starting and ending PR head SHAs and commit SHAs created.
            B. Source files changed and concrete runtime behavior changed.
            C. Exact test commands, exit codes, and observed outcomes.
            D. Seven-frame readiness table (READY/BLOCKED with evidence-based reason).
            E. P1→P2 publication status: locally proven versus deployment-unverified.
            F. PR status and manual-merge readiness; explicitly confirm no PR was merged.
            Continue iteratively until all safely actionable implementation work is complete.