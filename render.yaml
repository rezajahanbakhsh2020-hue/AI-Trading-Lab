services:
  - type: worker
    name: p1-live-execution-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_live_execution.py --continuous --symbol XAUUSD --timeframes 1m,5m,15m,30m,1H,4H,1D --candidate-id 1D=cand_moving_average_1d_verified_20261020 --publish
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: PROJECT2_PUBLISH_ENABLED
        value: "true"
      - key: PROJECT2_PUBLISH_URL
        value: "https://ai-trading-lab-platform-1.onrender.com/api/v1/integration/project1/ingest"
      - key: PROJECT2_API_KEY
        sync: false
